[project]
name = "rag-agent-platform"
version = "0.1.0"
description = "Production-ready RAG agent with LangGraph, pgvector, and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    # Agent Framework (LangGraph without heavy deps)
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
    "asyncpg>=0.29.0",
    # Cache
    "redis>=5.0.0",
    # Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # HTTP
    "httpx>=0.27.0",
    # Logging
    "structlog>=24.0.0",
    # OpenAI (lightweight, no torch)
    "openai>=1.40.0",
    # Token counting (lightweight)
    "tiktoken>=0.7.0",
    # Async support
    "tenacity>=8.0.0",
    "greenlet>=3.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
frontend = [
    "streamlit>=1.35.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ─── Ruff Configuration ──────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "Q", "UP"]
ignore = ["E501", "B008"]

# ─── Mypy Configuration ──────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# ─── Pytest Configuration ────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "strict"
