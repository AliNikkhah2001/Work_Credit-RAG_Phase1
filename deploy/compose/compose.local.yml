# Laptop/test overlay: LiteLLM → OpenRouter; CPU retrieval; loopback debug ports.
# REQUIRES in .env: DANA_ENV=test and LLM_UPSTREAM_MODE=openrouter
# Do NOT use this overlay on the GPU server (use compose.gpu.yml / deploy/vast / deploy/docker).
#
#   docker compose -f deploy/compose/compose.base.yml -f deploy/compose/compose.local.yml --env-file deploy/compose/.env up -d --build

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-local-dev-change-me}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./litellm.local.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks: [rag]
    restart: unless-stopped

  guardrails:
    environment:
      UPSTREAM_LLM_BASE_URL: http://litellm:4000/v1
      UPSTREAM_LLM_MODEL: ${UPSTREAM_LLM_MODEL:-chat-primary}
      UPSTREAM_LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-local-dev-change-me}
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_MODEL: ${UPSTREAM_LLM_MODEL:-chat-primary}
    depends_on:
      litellm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8200:8200"

  kb:
    environment:
      KB_EMBED_DEVICE: ${KB_EMBED_DEVICE:-cpu}
      KB_RERANKER_DEVICE: ${KB_RERANKER_DEVICE:-cpu}
      DVC_REMOTE_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_ENDPOINT_URL: http://minio:9000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - models:/models
      - ../../components/knowledgebase/kb-source:/kb-source:ro
      - ../../components/knowledgebase/kb-manager/packs:/app/packs
      - ../../components/knowledgebase/kb-manager/data/manifests:/app/data/manifests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  orchestrator:
    ports:
      - "127.0.0.1:8100:8100"

  postgres:
    ports:
      - "127.0.0.1:15432:5432"

  redis:
    ports:
      - "127.0.0.1:16379:6379"

  # Optional S3-compatible store for DVC (when image registry allows pull).
  # Default laptop DVC remote is local filesystem under kb-source/dvc-storage.
  # Enable with: COMPOSE_PROFILES=minio
  minio:
    profiles: ["minio"]
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rag]
    restart: unless-stopped

  minio-init:
    profiles: ["minio"]
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/kb-corpus || true &&
      mc anonymous set download local/kb-corpus || true
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks: [rag]

  tracing:
    ports:
      - "127.0.0.1:13002:3000"

  webui:
    ports:
      - "127.0.0.1:13000:8080"
