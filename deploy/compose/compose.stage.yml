# Stage overlay (Jenkins develop): alt host ports so it can coexist with local/prod-sim.
# Uses Compose !override so ports REPLACE local.yml (compose merges sequences by append).
#   docker compose -p dana-stage -f deploy/compose/compose.base.yml -f deploy/compose/compose.local.yml -f deploy/compose/compose.stage.yml --env-file deploy/compose/.env up -d

services:
  litellm:
    ports: !override
      - "127.0.0.1:14000:4000"
  kb:
    ports: !override
      - "127.0.0.1:18000:8000"
  guardrails:
    ports: !override
      - "127.0.0.1:18200:8200"
  orchestrator:
    ports: !override
      - "127.0.0.1:18100:8100"
  postgres:
    ports: !override
      - "127.0.0.1:25432:5432"
  redis:
    ports: !override
      - "127.0.0.1:26379:6379"
  tracing:
    ports: !override
      - "127.0.0.1:13001:3000"
  webui:
    ports: !override
      - "127.0.0.1:13100:8080"
    environment:
      WEBUI_NAME: "Dana (stage)"
