# Simulation-only base compose. Deliberately mirrors the production hazard:
# NO `ports:` mappings here. All published ports live in compose.override.yml.
# Started base-only this reproduces the Nov 2026 outage shape exactly: containers
# healthy, zero published host ports, site unreachable.
services:
  web:
    image: python:3.11-slim
    command:
      - python
      - -c
      - |
        import http.server, socketserver
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                body = b'{"status":"ok","service":"web"}'
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a):
                pass
        socketserver.TCPServer(("0.0.0.0", 8080), H).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

