# Jenkins LTS — laptop STAGE controller (Sprint A).
#   docker compose -f deploy/jenkins/docker-compose.yml up -d --build
# UI: http://127.0.0.1:8085
# Multibranch job recommendation: dana-rag-stage (develop + feature/*).
#
# GPU / prod controller (separate host):
#   docker compose -f deploy/jenkins/docker-compose.yml \
#     -f deploy/jenkins/docker-compose.gpu.yml up -d --build
#   → job dana-rag-prod, main only, DANA_ROLE=prod
#
# First login password (fresh volume):
#   docker exec dana-jenkins cat /var/jenkins_home/secrets/initialAdminPassword

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: dana-jenkins:lts
    container_name: dana-jenkins
    user: root
    ports:
      - "127.0.0.1:8085:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path inside container as on the Mac host so `docker compose`
      # bind mounts resolve for the Docker Desktop daemon (docker.sock).
      - ../..:/Users/alinikkhah/Documents/Work/CreditScoring/Chatbot_production_v1:rw
      - ../..:/workspace/Work_Credit-RAG_Phase1:rw
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      DOCKER_HOST: unix:///var/run/docker.sock
      DANA_HOST_REPO: /Users/alinikkhah/Documents/Work/CreditScoring/Chatbot_production_v1
      DANA_HOST: laptop
      # stage controller: may deploy dana-stage; must NOT deploy prod/gpu
      DANA_ROLE: stage
    restart: unless-stopped

volumes:
  jenkins_home:
