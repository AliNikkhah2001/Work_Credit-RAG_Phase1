# GPU / production Jenkins overlay (Sprint A — separate controllers).
# Usage on the server (after editing host bind path — see README first-boot):
#   docker compose -f deploy/jenkins/docker-compose.yml \
#     -f deploy/jenkins/docker-compose.gpu.yml up -d --build
#
# Multibranch job name recommendation: dana-rag-prod (discover main only).
# Do NOT set OpenRouter credentials on this host.

services:
  jenkins:
    container_name: dana-jenkins-prod
    environment:
      DANA_HOST: gpu
      DANA_ROLE: prod
      # This host owns prod verification: a `main` build that skips the prod
      # deploy is a hard failure, never a green check.
      CI_REQUIRE_PROD_CONTROLLER: "1"
      CI_MAIN_PROOF_POLICY: "fail"
      GITHUB_STATUS_ENABLED: "${GITHUB_STATUS_ENABLED:-1}"
      # Override on the server to the absolute clone path (same inside container):
      # DANA_HOST_REPO: /path/to/Work_Credit-RAG_Phase1
    ports:
      - "127.0.0.1:8085:8080"
      - "127.0.0.1:50000:50000"
