version: '3.8'

services:
  # ---- Load Balancer & API Gateway ----
  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - rag
    restart: unless-stopped

  # ---- Python API Workers ----
  api:
    build:
      context: ../../components/knowledgebase/kb-manager
      dockerfile: Dockerfile
    image: rag-kb:gpu
    container_name: rag-api
    command: ["gunicorn", "kb_manager.web.app:app", "--workers", "64", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000"]
    environment:
      KB_DB_URL: qdrant://qdrant:6333
      TRITON_URL: triton:8001
      REDIS_URL: redis://redis-stack:6379
      HF_HOME: /models
    volumes:
      - models:/models
    expose:
      - "8000"
    depends_on:
      - qdrant
      - redis-stack
      - triton
    networks:
      - rag
    # Note: shm_size must match triton's to allow shared memory transfer
    shm_size: '32gb'
    restart: unless-stopped

  # ---- Vector Storage (Qdrant) ----
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    networks:
      - rag
    restart: unless-stopped

  # ---- Semantic Vector Cache (Redis Stack) ----
  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: rag-redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - rag
    restart: unless-stopped

  # ---- GPU Inference (NVIDIA Triton) ----
  triton:
    image: nvcr.io/nvidia/tritonserver:24.03-py3
    container_name: rag-triton
    command: ["tritonserver", "--model-repository=/models/triton_repository", "--pinned-memory-pool-byte-size=4294967296"]
    volumes:
      - models:/models
    expose:
      - "8000"
      - "8001"
      - "8002"
    networks:
      - rag
    # CRITICAL: 32GB Shared memory for Gunicorn -> Triton IPC
    shm_size: '32gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  models:
  qdrant_data:
  redis_data:

networks:
  rag:
    driver: bridge
