# MVP compose for Vast.ai — Gemma is external host llama-server :18000
# No gemma-manager. Guardrails -> host.docker.internal:18000/v1
# Public: 0.0.0.0:13000 -> Open WebUI :8080
# Internal: kb, guardrails, orchestrator via Docker DNS (no public ports)
# Orchestrator :8100 is internal; expose 8100 only for debugging if needed.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kb_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./components/knowledgebase/kb-manager/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rag
    restart: unless-stopped

  kb-manager:
    build:
      context: ./components/knowledgebase/kb-manager
      dockerfile: Dockerfile
    container_name: rag-kb
    environment:
      KB_DB_HOST: postgres
      KB_DB_PORT: 5432
      KB_DB_NAME: kb_manager
      KB_DB_USER: postgres
      KB_DB_PASSWORD: postgres
      KB_WEB_HOST: 0.0.0.0
      KB_WEB_PORT: 8000
      # Source is baked into image via kb-source submodule; for Vast SQLite fallback is not used here
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode()==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - rag
    restart: unless-stopped

  guardrails:
    build:
      context: ./components/guardrails
      dockerfile: Dockerfile
    container_name: rag-guardrails
    environment:
      GUARDRAILS_HOST: 0.0.0.0
      GUARDRAILS_PORT: 8200
      UPSTREAM_LLM_BASE_URL: http://host.docker.internal:18000/v1
      UPSTREAM_LLM_MODEL: ${LLM_MODEL:-unsloth/gemma-4-31B-it-GGUF:UD-Q4_K_XL}
      UPSTREAM_LLM_API_KEY: ${LLM_API_KEY:-sk-local-dev}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:18000/v1}
      LLM_MODEL: ${LLM_MODEL:-unsloth/gemma-4-31B-it-GGUF:UD-Q4_K_XL}
    expose:
      - "8200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8200/health').read())"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rag
    restart: unless-stopped

  # Self-hosted Langfuse stack (requires Docker privileged host; on unprivileged Vast use host collector :3000 fallback)
  langfuse-db:
    image: postgres:15
    container_name: rag-langfuse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rag
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: rag-clickhouse
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    expose:
      - "8123"
      - "9000"
    healthcheck:
      test: ["CMD", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rag
    restart: unless-stopped

  langfuse:
    image: ghcr.io/langfuse/langfuse:2
    container_name: rag-langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://langfuse:3000
      NEXTAUTH_SECRET: langfuse-secret-please-change-in-production
      SALT: langfuse-salt-please-change-in-production
      CLICKHOUSE_URL: http://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_MIGRATION_URL: http://clickhouse:8123
      LANGFUSE_CLOUD_REGION: ""
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: org
      LANGFUSE_INIT_PROJECT_ID: rag
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-mvp-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-mvp-local
      LANGFUSE_INIT_USER_EMAIL: admin@work-rag.local
      LANGFUSE_INIT_USER_PASSWORD: admin123
      LANGFUSE_INIT_USER_NAME: Admin
    expose:
      - "3000"
    ports:
      - "0.0.0.0:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - rag
    restart: unless-stopped

  orchestrator:
    build:
      context: ./components/orchestrator
      dockerfile: Dockerfile
    container_name: rag-orchestrator
    environment:
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: 8100
      KB_BASE_URL: http://kb-manager:8000
      GUARDRAILS_BASE_URL: http://guardrails:8200
      UPSTREAM_LLM_MODEL: ${LLM_MODEL:-unsloth/gemma-4-31B-it-GGUF:UD-Q4_K_XL}
      REQUEST_TIMEOUT_SECONDS: 120
      RETRIEVAL_TOP_K: 5
      # Langfuse self-hosted (Docker DNS) + host fallback http://host.docker.internal:3000
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-mvp-local}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-mvp-local}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
    expose:
      - "8100"
    # Uncomment to expose for debugging:
    # ports:
    #   - "127.0.0.1:8100:8100"
    depends_on:
      kb-manager:
        condition: service_healthy
      guardrails:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8100/health').read())"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rag
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rag-open-webui
    ports:
      - "0.0.0.0:13000:8080"
    environment:
      WEBUI_AUTH: "false"
      WEBUI_NAME: "Work RAG (Vast)"
      USE_OLLAMA_DOCKER: "false"
      USE_CUDA_DOCKER: "false"
      OPENAI_API_BASE_URL: http://orchestrator:8100/v1
      OPENAI_API_KEY: sk-local-dev
      # Public deployment should enable auth or firewall to tester's IP
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - rag
    restart: unless-stopped

volumes:
  pgdata:
  langfuse_pgdata:
  clickhouse_data:

networks:
  rag:
    driver: bridge
