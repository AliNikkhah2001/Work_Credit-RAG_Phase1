# MVP Docker Compose - Integrated RAG Pipeline
# 
# This compose file wires together all four components for the MVP:
# - KB Manager (port 8000)
# - Orchestrator (port 8100)
# - Guardrails (port 8200)
# - Gemma Manager (port 9000) - from server-setup
# - Open WebUI (port 13000) - configured to use Orchestrator
#
# Usage:
#   docker compose -f compose.mvp.yml up -d
#
# Prerequisites:
# - Gemma model (gemma-4-31b) must be available at /models/gemma-4-31b.gguf
# - KB source files at ./components/knowledgebase/kb-source
# - Run from the parent repository root

services:
  # --- Infrastructure (from server-setup) ---
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports: ["16379:6379"]
    networks: [rag-network]

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: rag
    ports: ["15432:5432"]
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    networks: [rag-network]

  # --- Embedding Services (from server-setup) ---
  embed-e5-small:
    build:
      context: ./components/server-setup
      dockerfile: Dockerfile.embed
    container_name: rag-embed-e5-small
    environment:
      MODEL_PATH: /models/intfloat_multilingual-e5-small
      MODEL_ID: multilingual-e5-small
      PORT: 8001
    ports: ["8001:8001"]
    volumes:
      - ./components/server-setup/offline-prep/models/huggingface:/models:ro
    networks: [rag-network]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  embed-bge-m3:
    build:
      context: ./components/server-setup
      dockerfile: Dockerfile.embed
    container_name: rag-embed-bge-m3
    environment:
      MODEL_PATH: /models/BAAI_bge-m3
      MODEL_ID: bge-m3
      PORT: 8002
    ports: ["8002:8002"]
    volumes:
      - ./components/server-setup/offline-prep/models/huggingface:/models:ro
    networks: [rag-network]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- KB Manager ---
  kb-manager:
    build:
      context: ./components/knowledgebase/kb-manager
      dockerfile: Dockerfile
    container_name: rag-kb-manager
    environment:
      KB_DB_URL: postgresql+asyncpg://postgres:testpass@pgvector:5432/rag
      KB_SOURCE_DIR: /kb-source
      KB_EMBED_MODEL: paraphrase-multilingual-MiniLM-L12-v2
      KB_EMBED_URL: http://embed-e5-small:8001/v1
      KB_WEB_PORT: 8000
      KB_RERANKER_MODEL: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    ports: ["8000:8000"]
    volumes:
      - ./components/knowledgebase/kb-source:/kb-source:ro
      - kb-data:/data
    depends_on:
      - pgvector
      - embed-e5-small
    networks: [rag-network]

  # --- Gemma Manager (from server-setup) ---
  gemma-manager:
    build:
      context: ./components/server-setup/llm_inference_manager
      dockerfile: Dockerfile
    container_name: rag-gemma-manager
    environment:
      MODEL_REGISTRY_PATH: /models
      DATABASE_PATH: /data/manager.db
      LOG_DIR: /logs
      API_TOKEN: sk-local-dev
    ports: ["9000:9000"]
    volumes:
      - ./components/server-setup/offline-prep/models/huggingface/bartowski_google_gemma-4-31B-it-GGUF:/models/gemma-4-31b:ro
      - gemma-manager-data:/data
      - gemma-manager-logs:/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [rag-network]

  # --- Guardrails ---
  guardrails:
    build:
      context: ./components/guardrails
      dockerfile: Dockerfile
    container_name: rag-guardrails
    environment:
      GUARDRAILS_PORT: 8200
      UPSTREAM_LLM_BASE_URL: http://gemma-manager:9000/v1
      UPSTREAM_LLM_MODEL: gemma-4-31b
      UPSTREAM_LLM_API_KEY: sk-local-dev
      UPSTREAM_CONNECT_TIMEOUT: 10.0
      UPSTREAM_READ_TIMEOUT: 120.0
      POLICY_VERSION: mvp-1
    ports: ["8200:8200"]
    depends_on:
      - gemma-manager
    networks: [rag-network]

  # --- Orchestrator ---
  orchestrator:
    build:
      context: ./components/orchestrator
      dockerfile: Dockerfile
    container_name: rag-orchestrator
    environment:
      ORCHESTRATOR_PORT: 8100
      KB_BASE_URL: http://kb-manager:8000
      GUARDRAILS_BASE_URL: http://guardrails:8200
      REQUEST_TIMEOUT_SECONDS: 120
      RETRIEVAL_TOP_K: 5
    ports: ["8100:8100"]
    depends_on:
      - kb-manager
      - guardrails
    networks: [rag-network]

  # --- Open WebUI ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rag-open-webui
    environment:
      WEBUI_AUTH: "false"
      USE_OLLAMA_DOCKER: "false"
      USE_CUDA_DOCKER: "false"
      USE_EMBEDDING_MODEL_DOCKER: sentence-transformers/all-MiniLM-L6-v2
      RAG_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      OPENAI_API_BASE_URL: http://orchestrator:8100/v1
      OPENAI_API_KEY: sk-local-dev
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
    ports: ["13000:8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - orchestrator
    networks: [rag-network]

networks:
  rag-network:
    driver: bridge

volumes:
  pgvector-data:
  kb-data:
  gemma-manager-data:
  gemma-manager-logs: